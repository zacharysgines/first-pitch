name: Refresh daily game scores

on:
  schedule:
    # Primary: 13:37 UTC = 7:37 AM MDT / 6:37 AM MST
    - cron: "37 13 * * *"
    # Backup: 15:07 UTC = 9:07 AM MDT / 8:07 AM MST
    - cron: "7 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-scores
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run refresh script
        env:
          REQUIRE_FRESH_PITCHER_WAR: "1"
        run: |
          python scripts/update_scores.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add scores/game_scores.json lineups/lineups.json win_streaks/win_streaks.json starting_pitchers/war_lookup.json
          git diff --cached --quiet || git commit -m "Refresh game scores (scheduled)"
          git push
