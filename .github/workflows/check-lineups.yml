name: Check Lineups

on:
  schedule:
    # 9:00 AM–5:30 PM MDT
    - cron: "7,37 15-23 * * *"

    # 6:00 PM–9:30 PM MDT
    - cron: "7,37 0-3 * * *"

    # 10:00 PM MDT
    - cron: "7 4 * * *"

  workflow_dispatch:

concurrency:
  group: check-lineups
  cancel-in-progress: true

jobs:
  check-lineups:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run lineup check
        run: python scripts/check_lineups.py

      - name: Commit updated lineup files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lineups/lineups.json scores/game_scores.json
          git diff --cached --quiet || git commit -m "Update lineup snapshots"
          git push
